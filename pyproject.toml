[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nobel-laureate-books"
version = "0.1.0"
description = "A provenance-rich bibliography of books by Nobel laureates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "typer>=0.15",
]

[project.scripts]
nobel-books = "nobel_books.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nobel_books"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=nobel_books --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["DESIGN.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nobel_books"]
