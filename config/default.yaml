project:
  contact_email: ""
  user_agent: "nobel-laureate-books/0.1 (+contact email required)"
  database_url: "sqlite:///data/nobel_books.sqlite3"

categories:
  - physics
  - chemistry
  - medicine

sources:
  nobel:
    enabled: true
    base_url: "https://api.nobelprize.org/2.1"
    requests_per_second: 1.0
    page_size: 100
  wikidata:
    enabled: true
    base_url: "https://query.wikidata.org/sparql"
    requests_per_second: 0.5
    page_size: 10
  openlibrary:
    enabled: true
    base_url: "https://openlibrary.org"
    requests_per_second: 0.5
    page_size: 50
    max_authors_per_run: 10
  google_books:
    enabled: true
    base_url: "https://www.googleapis.com/books/v1"
    requests_per_second: 2.0
    page_size: 40
    max_authors_per_run: 5
    max_results_per_query: 400
    api_key_env: "GOOGLE_BOOKS_API_KEY"
  openalex:
    enabled: true
    base_url: "https://api.openalex.org"
    requests_per_second: 1.0
    page_size: 100
    max_authors_per_run: 10
    api_key_env: "OPENALEX_API_KEY"
    include_xpac: false
  crossref:
    enabled: true
    base_url: "https://api.crossref.org"
    requests_per_second: 1.0
    page_size: 100
    mailto_env: "CROSSREF_MAILTO"
  wikipedia:
    enabled: true
    base_url: "https://en.wikipedia.org/w/api.php"
    requests_per_second: 0.5
    max_authors_per_run: 10
    bibliography_headings:
      - bibliography
      - books
      - selected works
      - publications
      - works
      - major works

exports:
  output_dir: "data/exports"
  include_rejected: false
  include_unreviewed: false

log_level: "INFO"
